name: Release

# Pushing a tag such as v0.1.0-alpha publishes a GitHub pre-release with the `jig` binary for
# Linux x86-64, macOS on Apple silicon and Windows x86-64, the agent plugin and the C bootstrap
# (D28). `jig` is jigc, built from the C bootstrap (D6); the Rust compiler runs only the tests,
# as the reference.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the pinned Z3 solver
        run: pip install --user z3-solver==5.3.2.0 && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test
        run: cargo test --locked
      - name: The bootstrap is a fixed point
        run: sh bootstrap/update.sh --check

  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-latest
            target: arm64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          CC=clang sh bootstrap/install.sh "$PWD/dist/prefix"
          name="jig-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp dist/prefix/bin/jig README.md CHANGELOG.md LICENSE "dist/$name/"
          cp -r plugin docs "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: jig-${{ matrix.target }}
          path: dist/*.tar.gz

  package-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out with the files' own line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: MinGW-w64's gcc on the path
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_PATH
      - name: Package
        run: |
          name="jig-${GITHUB_REF_NAME}-x86_64-windows"
          mkdir -p "dist/$name"
          gcc -O2 -fno-math-errno -std=gnu11 -w -pthread bootstrap/jigc.c -lm -lws2_32 -static -o "dist/$name/jig.exe"
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          cp -r plugin docs "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: jig-x86_64-windows
          path: dist/*.zip

  publish:
    needs: [package, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: npm ci --no-audit --no-fund && npx --yes @vscode/vsce package --out "../../dist/jig-vscode-${GITHUB_REF_NAME}.vsix"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp bootstrap/jigc.c dist/jigc.c
          # The notes are the changelog's first section.
          awk '/^## /{n++} n==1' CHANGELOG.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" --prerelease --title "Jig $GITHUB_REF_NAME" \
            --notes-file dist/notes.md dist/*.tar.gz dist/*.zip dist/*.vsix dist/jigc.c
